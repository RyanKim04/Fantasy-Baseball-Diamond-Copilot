[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diamond-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "apache-airflow>=3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pybaseball>=2.2",
    "httpx>=0.27,<1.0",
    "tenacity>=8.0,<10.0",
    "yahoo_fantasy_api>=2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "MLB-StatsAPI>=1.7",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0,<5.0",
    "scikit-learn>=1.4,<2.0",
    "mlflow>=2.12,<3.0",
    "mapie>=0.9,<1.0",
    "optuna>=3.6,<4.0",
    "matplotlib>=3.8,<4.0",
    "scipy>=1.12,<2.0",
    "statsmodels>=0.14,<1.0",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
    "nbformat>=5.0",
]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.ruff]
target-version = "py311"
line-length = 99
exclude = ["infra/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
