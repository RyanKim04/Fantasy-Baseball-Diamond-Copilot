x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://diamond:diamond_dev@postgres:5432/airflow_metadata
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:-}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    PYTHONPATH: /opt/airflow
    DATABASE_URL: ${DATABASE_URL:-postgresql://diamond:diamond_dev@postgres:5432/diamond_copilot}
  volumes:
    - ../../packages/pipelines:/opt/airflow/dags
    - ../../packages:/opt/airflow/packages
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: diamond-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: diamond_dev
      POSTGRES_DB: diamond_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: diamond-copilot-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    container_name: diamond-copilot-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"

  airflow:
    <<: *airflow-common
    container_name: diamond-copilot-airflow
    command: standalone
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:db8::/64"

volumes:
  pgdata:
    driver: local
  airflow-logs:
    driver: local
