name: CI

on:
  push:
    branches: [main, "phase/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=packages/shared --cov-report=term-missing

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diamond
          POSTGRES_PASSWORD: diamond_dev
          POSTGRES_DB: diamond_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diamond -d diamond_copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://diamond:diamond_dev@localhost:5432/diamond_copilot_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: |
          if [ -d "infra/migrations/versions" ] && [ "$(ls -A infra/migrations/versions/*.py 2>/dev/null)" ]; then
            alembic upgrade head
          else
            echo "No migrations found, skipping"
          fi

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t diamond-copilot:${{ github.sha }} -f infra/docker/Dockerfile .
        continue-on-error: true  # Dockerfile may not exist yet

